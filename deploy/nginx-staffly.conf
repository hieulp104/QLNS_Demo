# Host Nginx site cho bản demo NA (staffly.io.vn). Cài trên VPS:
#   cp deploy/nginx-staffly.conf /etc/nginx/sites-available/staffly
#   ln -s /etc/nginx/sites-available/staffly /etc/nginx/sites-enabled/staffly
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d staffly.io.vn -d storage.staffly.io.vn   # tự thêm HTTPS
# Cần 2 bản ghi DNS A (@ và storage) trỏ về IP VPS trước khi chạy certbot.

# App Next.js (container na-demo-app)
server {
    listen 80;
    server_name staffly.io.vn;
    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}

# MinIO API (S3) — trình duyệt upload/xem file qua presigned URL. Object vẫn
# private, chỉ mở được bằng URL có chữ ký hết hạn 15 phút. PHẢI giữ nguyên Host
# để chữ ký khớp.
server {
    listen 80;
    server_name storage.staffly.io.vn;
    client_max_body_size 210M; # file 3D/CAD tối đa 200MB

    location / {
        proxy_pass http://127.0.0.1:8101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }
}
