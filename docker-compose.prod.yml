# ════════════════════════════════════════════════════════════════════
# NA — PRODUCTION (self-host trên VPS).
# Chạy:  docker compose -f docker-compose.prod.yml up -d --build
#        (tự migrate + nạp dữ liệu demo qua service `migrate` trước khi bật app)
#
# Khác docker-compose.yml (dev):
#  · Có service `app` (Next) + `caddy` (reverse proxy + HTTPS tự động).
#  · Postgres & MinIO KHÔNG map cổng ra ngoài — chỉ nội bộ Docker network.
#  · Biến nhạy cảm đọc từ .env (xem .env.example mục "CHỈ PRODUCTION").
# ════════════════════════════════════════════════════════════════════
name: na-demo

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: na-demo-app
    restart: unless-stopped
    # Nạp toàn bộ biến app (DATABASE_URL, AUTH_*, MINIO_*) từ .env.
    env_file: .env
    environment:
      NODE_ENV: production
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    expose:
      - "3000" # chỉ nội bộ, Caddy proxy vào

  postgres:
    image: postgres:15-alpine
    container_name: na-demo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: na
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Chua dat POSTGRES_PASSWORD trong .env}
      POSTGRES_DB: na
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U na -d na"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    # minio/minio đã bị gỡ khỏi Docker Hub — dùng bản fork tương thích của Pigsty.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: na-demo-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?Chua dat MINIO_ACCESS_KEY trong .env}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?Chua dat MINIO_SECRET_KEY trong .env}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Chạy MỖI lần `up`: migration + nạp dữ liệu demo, xong thì thoát; `app` chỉ
  # bật sau khi service này thành công. Seed idempotent — dữ liệu khách tạo thêm
  # vẫn giữ, chỉ các bản ghi mẫu được đưa về đúng giá trị trong seed.ts.
  # Build từ stage `builder` vì ở đó mới có Prisma CLI + tsx + source.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    restart: "no"
    env_file: .env
    environment:
      NODE_ENV: production
      # Seed upload avatar thẳng vào MinIO qua mạng nội bộ — lúc này Caddy (và
      # domain storage công khai trong .env) chưa chắc đã chạy.
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && npm run db:seed"

  caddy:
    image: caddy:2-alpine
    container_name: na-demo-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Chua dat APP_DOMAIN trong .env}
      STORAGE_DOMAIN: ${STORAGE_DOMAIN:?Chua dat STORAGE_DOMAIN trong .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # chứng chỉ Let's Encrypt — đừng xóa
      - caddy_config:/config
    depends_on:
      - app
      - minio

volumes:
  postgres_data:
  minio_data:
  caddy_data:
  caddy_config:
